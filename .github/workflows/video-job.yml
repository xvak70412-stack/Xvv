name: Video Job

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  video-job:
    if: contains(github.event.issue.labels.*.name, 'video-job')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Python dependencies
        run: |
          py -m pip install --upgrade pip
          py -m pip install --upgrade yt-dlp Pillow
      - name: Run video job
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_EVENT_PATH: \${{ github.event_path }}
          GITHUB_RUN_URL: https://github.com/\${{ github.repository }}/actions/runs/\${{ github.run_id }}
        run: |
          py vlog-video-harness-chatgpt-bridge/vlog-video-harness/scripts/github_job_windows.py
      - name: Upload video outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-job-\${{ github.event.issue.number }}
          path: vlog-video-harness-chatgpt-bridge/vlog-video-harness/output/github-job-\${{ github.event.issue.number }}
          if-no-files-found: warn
          retention-days: 7

name: Video Job

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  video-job:
    if: contains(github.event.issue.labels.*.name, 'video-job')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    defaults:
      run:
        shell: powershell

    steps:
      - name: Configure GitHub proxy before checkout
        run: |
          @'
          import os
          from urllib.request import getproxies
          from urllib.parse import urlsplit
          
          proxies = getproxies()
          proxy = os.environ.get("GITHUB_PROXY")
          if proxy is None:
              proxy = os.environ.get("YOUTUBE_PROXY")
          if proxy is None:
              proxy = proxies.get("https") or proxies.get("http") or proxies.get("all") or ""
          if proxy and "://" not in proxy:
              proxy = "http://" + proxy
          if any(character in proxy for character in ("\r", "\n")):
              raise SystemExit("Invalid proxy value")
          if proxy:
              if urlsplit(proxy).scheme not in ("http", "https", "socks5", "socks5h"):
                  raise SystemExit("Unsupported Git proxy scheme")
              print("::add-mask::" + proxy)
              count = int(os.environ.get("GIT_CONFIG_COUNT", "0"))
              values = {
                  "HTTP_PROXY": proxy,
                  "HTTPS_PROXY": proxy,
                  "GIT_CONFIG_COUNT": str(count + 1),
                  f"GIT_CONFIG_KEY_{count}": "http.https://github.com/.proxy",
                  f"GIT_CONFIG_VALUE_{count}": proxy,
              }
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
                  for key, value in values.items():
                      output.write(key + "=" + value + "\n")
              print("GitHub checkout will use the detected proxy")
          else:
              print("No system proxy detected; GitHub checkout will use existing Git network settings")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Proxy configuration failed" }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Python dependencies
        run: |
          python --version
          python -m pip install --upgrade "yt-dlp[default]" Pillow

      - name: Verify Python dependencies
        run: |
          python -c "import yt_dlp, PIL; print('Dependencies OK')"
          python -m yt_dlp --version
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg unavailable" }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw "ffprobe unavailable" }

      - name: Run video job
        id: run_video
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
          YOUTUBE_COOKIES_PATH: C:\actions-runner\secrets\cookies.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python vlog-video-harness-chatgpt-bridge/vlog-video-harness/scripts/github_job_windows.py

      - name: Clean temporary video
        if: ${{ always() && (steps.run_video.outcome == 'success' || steps.run_video.outcome == 'failure') }}
        run: |
          $videoDir = "vlog-video-harness-chatgpt-bridge/vlog-video-harness/output/video"
          if (Test-Path $videoDir) {
            Remove-Item -LiteralPath $videoDir -Recurse -Force -ErrorAction Stop
          }

      - name: Upload video outputs
        if: ${{ always() && (steps.run_video.outcome == 'success' || steps.run_video.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: video-job-${{ github.event.issue.number }}
          path: |
            vlog-video-harness-chatgpt-bridge/vlog-video-harness/output/screenshots/*.jpg
            vlog-video-harness-chatgpt-bridge/vlog-video-harness/output/subtitles/*.vtt
          if-no-files-found: warn
          retention-days: 7

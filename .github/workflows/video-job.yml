name: Video Job

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  video-job:
    if: contains(github.event.issue.labels.*.name, 'video-job')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    env:
      PYTHONPATH: C:\actions-runner\video-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Python dependencies
        run: |
          & 'C:\Users\32766\AppData\Local\Programs\Python\Python314\python.exe' --version
          & 'C:\Users\32766\AppData\Local\Programs\Python\Python314\python.exe' -c "import yt_dlp, PIL; print('Dependencies OK')"
      - name: Run video job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          & 'C:\Users\32766\AppData\Local\Programs\Python\Python314\python.exe' vlog-video-harness-chatgpt-bridge/vlog-video-harness/scripts/github_job_windows.py
      - name: Upload video outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-job-${{ github.event.issue.number }}
          path: vlog-video-harness-chatgpt-bridge/vlog-video-harness/output/github-job-${{ github.event.issue.number }}
          if-no-files-found: warn
          retention-days: 7

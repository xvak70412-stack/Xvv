name: Video Job

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  video-job:
    if: contains(github.event.issue.labels.*.name, 'video-job')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: |
          python --version
          python -m pip install --upgrade "yt-dlp[default]" Pillow

      - name: Verify Python dependencies
        run: |
          python -c "import yt_dlp, PIL; print('Dependencies OK')"
          python -m yt_dlp --version

      - name: Run video job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python vlog-video-harness-chatgpt-bridge/vlog-video-harness/scripts/github_job_windows.py

      - name: Upload video outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-job-${{ github.event.issue.number }}
          path: |
            vlog-video-harness-chatgpt-bridge/vlog-video-harness/output
          if-no-files-found: warn
          retention-days: 7

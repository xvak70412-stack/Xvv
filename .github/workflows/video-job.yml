name: Video Job

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  video-job:

    if: contains(github.event.issue.labels.*.name, 'video-job')

    runs-on: [self-hosted, windows, X64]

    timeout-minutes: 180

    defaults:
      run:
        shell: powershell

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0


    - name: Debug repository
      run: |
        Write-Host "Current repository:"
        Get-Location

        Write-Host "Files:"
        dir


    - name: Install Python dependencies
      run: |

        python --version

        python -m pip install --upgrade pip

        pip install yt-dlp pillow


    - name: Run video job
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}

      run: |

        python scripts/github_job_windows.py


    - name: Upload video outputs
      uses: actions/upload-artifact@v4
      with:
        name: video-output
        path: outputs/
        if-no-files-found: ignore
          retention-days: 7
